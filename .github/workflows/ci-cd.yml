name: Frontend — Testes & Deploy
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  test:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes de integridade
        run: npm test

  deploy:
    name: Deploy Infra AWS e Aplicação S3+CloudFront
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-skip-session-tagging: true
          
      - name: 1. Descobrir ALB Domain do Backend
        run: |
          ALB_DOMAIN=$(aws cloudformation describe-stacks --stack-name nodefund-bff --query "Stacks[0].Outputs[?OutputKey=='ALBDnsName'].OutputValue" --output text)
          if [ -z "$ALB_DOMAIN" ] || [ "$ALB_DOMAIN" == "None" ]; then
            echo "Erro: Load Balancer do BFF não encontrado. A stack 'nodefund-bff' já foi criada?"
            exit 1
          fi
          echo "ALB_DOMAIN=$ALB_DOMAIN" >> $GITHUB_ENV

      - name: 2. Deploy da Infraestrutura Frontend (CloudFormation)
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation.yaml \
            --stack-name nodefund-frontend \
            --parameter-overrides BffLoadBalancerDomain=${{ env.ALB_DOMAIN }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: 3. Recuperar Parâmetros da Infra (Bucket e CloudFront)
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name nodefund-frontend --query "Stacks[0].Outputs[?OutputKey=='S3BucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name nodefund-frontend --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          
          echo "FRONTEND_BUCKET=$BUCKET" >> $GITHUB_ENV
          echo "CLOUDFRONT_ID=$DIST_ID" >> $GITHUB_ENV

      - name: 4. Sync de Arquivos Estáticos com S3
        run: |
          aws s3 sync . s3://${{ env.FRONTEND_BUCKET }} \
            --exclude '.git/*' \
            --exclude 'node_modules/*' \
            --exclude 'tests/*' \
            --exclude '*.md' \
            --exclude 'package*.json' \
            --exclude 'dev-server.js' \
            --exclude '.github/*' \
            --exclude '.gitignore' \
            --exclude 'infra/*' \
            --delete

      - name: 5. Invalidar Cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_ID }} \
            --paths '/*'
